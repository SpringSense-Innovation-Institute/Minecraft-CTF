
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知春CTF 游戏对局数据统计看板</title>
    <!-- 使用稳定的静态资源库 -->
    <script src="/cdn/echarts.min.js"></script>
    <style>
        :root {
            --bg-0: #0c161b;
            --bg-1: #15252b;
            --bg-2: #243840;
            --panel: rgba(24, 34, 39, 0.94);
            --panel-soft: rgba(36, 52, 58, 0.9);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f4f3df;
            --muted: #b7c5ba;
            --accent: #74bf52;
            --accent-2: #4b8a34;
            --danger: #d25743;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--text);
            font-family: Monaco, Consolas, "Lucida Console", monospace;
            background:
                    radial-gradient(circle at top, rgba(115, 196, 94, 0.18), transparent 28%),
                    linear-gradient(180deg, #163246 0%, #0a171c 100%);
            background-attachment: fixed;
            padding: 24px;
        }

        /* 基础组件复用 */
        .app-shell {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
            margin: 0;
        }

        .panel-card {
            border: 2px solid rgba(255, 255, 255, 0.12);
            background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 100%),
                    var(--panel);
            box-shadow:
                    0 22px 40px rgba(0, 0, 0, 0.28),
                    inset 0 0 0 2px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
            border-radius: 4px;
        }

        /* 控制栏布局 */
        .controls-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .select-container {
            position: relative;
            display: inline-block;
        }

        .mc-select {
            appearance: none;
            padding: 12px 40px 12px 16px;
            font-size: 16px;
            font-family: inherit;
            border: 2px solid rgba(255, 255, 255, 0.14);
            background: rgba(10, 17, 20, 0.9);
            color: var(--text);
            outline: none;
            cursor: pointer;
            min-width: 280px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .mc-select:focus, .mc-select:hover {
            border-color: rgba(116, 191, 82, 0.7);
            box-shadow: 0 0 0 3px rgba(116, 191, 82, 0.18);
        }

        .mc-select option {
            background: var(--bg-1);
            color: var(--text);
        }

        .select-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            font-size: 12px;
        }

        .mc-button {
            padding: 12px 24px;
            border: none;
            cursor: pointer;
            color: #f8f6e2;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
            box-shadow:
                    inset 0 -3px 0 rgba(0, 0, 0, 0.28),
                    inset 0 2px 0 rgba(255, 255, 255, 0.18),
                    0 8px 18px rgba(0, 0, 0, 0.22);
            transition: transform 120ms ease, filter 120ms ease;
        }

        .mc-button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .mc-button:active {
            transform: translateY(1px);
        }

        /* 仪表盘布局 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .chart-card {
            padding: 20px;
            height: 380px;
            display: flex;
            flex-direction: column;
        }

        .chart-container {
            width: 100%;
            flex: 1;
        }

        #loading {
            text-align: center;
            font-size: 18px;
            color: var(--muted);
            display: none;
            margin-top: 50px;
            padding: 40px;
            border: 2px dashed rgba(255,255,255,0.1);
        }

        @media (max-width: 980px) {
            .dashboard { grid-template-columns: 1fr; }
            .brand-title { font-size: 24px; }
            .chart-card { height: 320px; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <header class="app-header">
        <h1 class="brand-title">📊 游戏对局数据统计看板</h1>
    </header>

    <div class="panel-card controls-container">
        <div class="select-container">
            <select id="nameSelect" class="mc-select" onchange="handleSelectChange(this.value)">
                <option value="">正在连接红石网络加载列表...</option>
            </select>
            <span class="select-arrow">▼</span>
        </div>
        <button class="mc-button" onclick="refreshCurrentData()">强制刷新数据</button>
    </div>

    <div id="loading" class="panel-card">
        <div>⏳ 正在读取区块数据，请稍候...</div>
    </div>

    <div class="dashboard" id="dashboard" style="display: none;">
        <!-- 第一组：绝对数值统计 -->
        <div class="panel-card chart-card"><div id="chart-withNone" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-withBot" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-withOther" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-catch" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-flag" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-win" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-totalTime" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-playerCatch" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-playerFlag" class="chart-container"></div></div>

        <!-- 第二组：场均/条件统计 (要求15场以上) -->
        <div class="panel-card chart-card"><div id="chart-avgWinRate" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-avgCatch" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-avgFlag" class="chart-container"></div></div>
        <div class="panel-card chart-card"><div id="chart-avgShortestTime" class="chart-container"></div></div>
    </div>
</div>

<script>
    let chartInstances = [];
    const TOP_N = 5;

    document.addEventListener('DOMContentLoaded', async () => {
        await loadNameList();
    });

    async function loadNameList() {
        try {
            const response = await fetch('/statistics/list');
            const list = await response.json();

            const select = document.getElementById('nameSelect');
            const currentValue = select.value;

            select.innerHTML = '<option value="">-- 请选择一个服务器/配置名称 --</option>';

            list.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });

            if (currentValue && list.includes(currentValue)) {
                select.value = currentValue;
            }
        } catch (error) {
            console.error("加载列表失败:", error);
            const select = document.getElementById('nameSelect');
            if(select.options.length <= 1) {
                select.innerHTML = '<option value="">❌ 加载失败，请检查后端</option>';
            }
        }
    }

    window.addEventListener('resize', () => {
        chartInstances.forEach(chart => chart.resize());
    });

    async function refreshCurrentData() {
        const select = document.getElementById('nameSelect');
        const currentName = select.value;

        if (!currentName) {
            alert("⚠️ 请先选择一个配置名称后再刷新！");
            return;
        }

        await loadNameList();
        handleSelectChange(currentName);
    }

    async function handleSelectChange(name) {
        if (!name) {
            document.getElementById('dashboard').style.display = 'none';
            return;
        }

        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        try {
            const response = await fetch(`/statistics/data?name=${encodeURIComponent(name)}`);
            const data = await response.json();
            renderAllCharts(data);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'grid';
            setTimeout(() => {
                chartInstances.forEach(chart => chart.resize());
            }, 50);

        } catch (error) {
            console.error("加载统计数据失败:", error);
            alert("加载数据失败，请查看控制台。");
            document.getElementById('loading').style.display = 'none';
        }
    }

    function getTopN(mapData, scale = 1, useGroupSuffix = true) {
        if (!mapData) return [];
        return Object.entries(mapData)
            .map(([key, val]) => ({ name: useGroupSuffix ? `${key}组` : key, value: val * scale }))
            .sort((a, b) => b.value - a.value)
            .slice(0, TOP_N)
            .reverse();
    }

    function getTopNAvg(numMap, denMap, minDenom = 15, scale = 1, isAsc = false) {
        if (!numMap || !denMap) return [];
        return Object.keys(numMap)
            .filter(key => (denMap[key] || 0) >= minDenom)
            .map(key => {
                const denominator = denMap[key] || 1;
                return {
                    name: `${key}组`,
                    value: (numMap[key] / denominator) * scale
                };
            })
            .sort((a, b) => isAsc ? a.value - b.value : b.value - a.value)
            .slice(0, TOP_N)
            .reverse();
    }

    function renderAllCharts(data) {
        chartInstances.forEach(chart => chart.dispose());
        chartInstances = [];

        // 图表颜色调优：提升亮度以适应暗色背景
        createBarChart('chart-withNone', '和 NONE 对局次数排行', getTopN(data.withNoneTimes), '次', '#73a0fa');
        createBarChart('chart-withBot', '和 BOT 对局次数排行', getTopN(data.withBotTimes), '次', '#8bb4ff');
        createBarChart('chart-withOther', '与其他玩家对局次数排行', getTopN(data.withOtherTimes), '次', '#a9db86');
        createBarChart('chart-catch', '抓人总次数排行', getTopN(data.catchTimes), '次', '#fcd573');
        createBarChart('chart-flag', '拿旗总次数排行', getTopN(data.getFlagTimes), '次', '#fa8686');
        createBarChart('chart-win', '获胜总次数排行', getTopN(data.winTimes), '次', '#8cd0eb');
        createBarChart('chart-totalTime', '总游戏时间排行', getTopN(data.totalTime, 1/1000), '秒', '#54c792');
        createBarChart('chart-playerCatch', '玩家抓人次数排行', getTopN(data.playerCatchTimes, 1, false), '次', '#6ec5c5');
        createBarChart('chart-playerFlag', '玩家拿旗次数排行', getTopN(data.playerGetFlagTimes, 1, false), '次', '#ffae73');

        createBarChart('chart-avgWinRate', '平均胜率排行 (≥15场)', getTopNAvg(data.winTimes, data.withOtherTimes, 15, 100, false), '%', '#ff9a70', true);
        createBarChart('chart-avgCatch', '场均抓人次数排行 (≥15场)', getTopNAvg(data.catchTimes, data.withOtherTimes, 15, 1, false), '次', '#b87dd4', true);
        createBarChart('chart-avgFlag', '场均拿旗次数排行 (≥15场)', getTopNAvg(data.getFlagTimes, data.withOtherTimes, 15, 1, false), '次', '#f098d8', true);
        createBarChart('chart-avgShortestTime', '平均每局耗时最短排行 (≥15场)', getTopNAvg(data.totalTime, data.withOtherTimes, 15, 1/1000, true), '秒', '#73a0fa', true);
    }

    function createBarChart(elementId, title, chartData, unit, color, isFloat = false) {
        const chartDom = document.getElementById(elementId);
        const myChart = echarts.init(chartDom);

        const formatValue = (val) => isFloat ? val.toFixed(2) : Math.round(val);

        const option = {
            title: {
                text: title,
                left: 'center',
                textStyle: {
                    fontSize: 16,
                    color: '#f4f3df', // 标题使用亮色
                    fontFamily: 'inherit'
                }
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                backgroundColor: 'rgba(24, 34, 39, 0.9)',
                borderColor: 'rgba(255,255,255,0.2)',
                textStyle: { color: '#f4f3df' },
                formatter: function (params) {
                    const data = params[0];
                    return `${data.name}<br/>${data.marker} ${formatValue(data.value)}${unit}`;
                }
            },
            grid: {
                left: '3%',
                right: '10%',
                bottom: '5%',
                containLabel: true
            },
            xAxis: {
                type: 'value',
                axisLabel: {
                    formatter: `{value} ${unit}`,
                    color: '#b7c5ba' // 坐标轴文字静音色
                },
                splitLine: {
                    lineStyle: {
                        type: 'dashed',
                        color: 'rgba(255, 255, 255, 0.1)' // 网格线半透明
                    }
                }
            },
            yAxis: {
                type: 'category',
                data: chartData.map(item => item.name),
                axisLabel: {
                    fontWeight: 'bold',
                    color: '#f4f3df'
                }
            },
            series: [
                {
                    type: 'bar',
                    data: chartData.map(item => item.value),
                    itemStyle: {
                        color: color,
                        borderRadius: [0, 4, 4, 0],
                        shadowColor: 'rgba(0, 0, 0, 0.5)',
                        shadowBlur: 4
                    },
                    label: {
                        show: true,
                        position: 'right',
                        formatter: (params) => `${formatValue(params.value)}${unit}`,
                        color: '#f4f3df', // 数据标签亮色
                        fontWeight: 'bold'
                    },
                    barMaxWidth: 24
                }
            ]
        };

        if (chartData.length === 0) {
            option.title.subtext = "暂无符合条件的数据";
            option.title.subtextStyle = { color: '#d25743', fontSize: 13 };
        }

        myChart.setOption(option);
        chartInstances.push(myChart);
    }
</script>
</body>
</html>
