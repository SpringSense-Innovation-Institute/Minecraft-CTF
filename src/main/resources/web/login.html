<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知春CTF 登录</title>
    <script src="/cdn/vue.global.prod.min.js"></script>
    <script src="/cdn/axios.min.js"></script>
    <style>
        :root {
            --bg-0: #0c161b;
            --bg-1: #15252b;
            --bg-2: #243840;
            --panel: rgba(24, 34, 39, 0.94);
            --panel-soft: rgba(36, 52, 58, 0.9);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f4f3df;
            --muted: #b7c5ba;
            --accent: #74bf52;
            --accent-2: #4b8a34;
            --danger: #d25743;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--text);
            font-family: Monaco, Consolas, "Lucida Console", monospace;
            background:
                radial-gradient(circle at top, rgba(115, 196, 94, 0.18), transparent 28%),
                linear-gradient(180deg, #163246 0%, #0a171c 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        button, input { font: inherit; }

        .login-card {
            width: 420px;
            max-width: 90vw;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 100%),
                var(--panel);
            box-shadow:
                0 22px 40px rgba(0, 0, 0, 0.28),
                inset 0 0 0 2px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
            margin: 0;
            text-align: center;
        }

        .login-subtitle {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin: 0;
            text-align: center;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .mc-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid rgba(255, 255, 255, 0.14);
            background: rgba(10, 17, 20, 0.9);
            color: var(--text);
            outline: none;
        }

        .mc-input:focus {
            border-color: rgba(116, 191, 82, 0.7);
            box-shadow: 0 0 0 3px rgba(116, 191, 82, 0.18);
        }

        .mc-button {
            padding: 12px 18px;
            border: none;
            cursor: pointer;
            color: #f8f6e2;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
            background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.28), inset 0 2px 0 rgba(255,255,255,0.18), 0 8px 18px rgba(0,0,0,0.22);
            transition: transform 120ms ease, filter 120ms ease;
            font-size: 16px;
        }

        .mc-button:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
        .mc-button:active:not(:disabled) { transform: translateY(1px); }
        .mc-button:disabled { filter: grayscale(1); cursor: not-allowed; opacity: 0.7; }

        .error-msg {
            color: var(--danger);
            text-align: center;
            font-size: 13px;
            margin: 0;
        }

        [v-cloak] { display: none; }
    </style>
</head>
<body>

<div id="app" v-cloak>
    <div class="login-card">
        <div>
            <h1 class="login-title">🔐 登录</h1>
            <p class="login-subtitle">知春CTF 玩家登录</p>
        </div>

        <form @submit.prevent="login">
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-row">
                    <label class="form-label">玩家 ID</label>
                    <input type="text" class="mc-input" v-model="id" placeholder="请输入你的玩家 ID" required>
                </div>
                <div class="form-row">
                    <label class="form-label">密码</label>
                    <input type="password" class="mc-input" v-model="password" placeholder="请输入密码" required>
                </div>
                <p v-if="error" class="error-msg">{{ error }}</p>
                <button type="submit" class="mc-button" :disabled="isSubmitting || !id || !password">
                    {{ isSubmitting ? '登录中...' : '登录' }}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const { createApp, ref } = Vue;

createApp({
    setup() {
        const id = ref('');
        const password = ref('');
        const error = ref('');
        const isSubmitting = ref(false);

        const login = async () => {
            error.value = '';
            isSubmitting.value = true;
            try {
                const res = await axios.post('/login/auth', { id: id.value.trim(), password: password.value });
                localStorage.setItem('user', JSON.stringify(res.data));
                window.location.href = '/';
            } catch (e) {
                if (e.response?.status === 401) {
                    error.value = 'ID 或密码错误';
                } else {
                    error.value = '连接失败: ' + e.message;
                }
            } finally {
                isSubmitting.value = false;
            }
        };

        return { id, password, error, isSubmitting, login };
    }
}).mount('#app');
</script>
</body>
</html>
