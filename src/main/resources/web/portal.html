<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知春CTF</title>
    <script src="/cdn/vue.global.prod.min.js"></script>
    <style>
        :root {
            --bg-0: #0c161b;
            --bg-1: #15252b;
            --bg-2: #243840;
            --panel: rgba(24, 34, 39, 0.94);
            --panel-soft: rgba(36, 52, 58, 0.9);
            --line: rgba(255, 255, 255, 0.14);
            --text: #f4f3df;
            --muted: #b7c5ba;
            --accent: #74bf52;
            --accent-2: #4b8a34;
            --danger: #d25743;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--text);
            font-family: Monaco, Consolas, "Lucida Console", monospace;
            background:
                radial-gradient(circle at top, rgba(115, 196, 94, 0.18), transparent 28%),
                linear-gradient(180deg, #163246 0%, #0a171c 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .portal-shell {
            width: 800px;
            max-width: 95vw;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .portal-header {
            text-align: center;
        }

        .portal-title {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
            margin: 0 0 4px 0;
        }

        .portal-subtitle {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin: 0;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 100%),
                var(--panel);
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.2),
                inset 0 0 0 2px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .user-info .user-name { color: var(--accent); font-weight: bold; }
        .user-info .user-id { color: var(--muted); font-size: 12px; }

        .logout-btn {
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            color: #f8f6e2;
            font-weight: bold;
            font-family: inherit;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
            background: linear-gradient(180deg, var(--danger) 0%, #a13d2d 100%);
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.28), inset 0 2px 0 rgba(255,255,255,0.18), 0 6px 14px rgba(0,0,0,0.22);
            transition: transform 120ms ease, filter 120ms ease;
            font-size: 13px;
        }

        .logout-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .logout-btn:active { transform: translateY(1px); }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        .link-card {
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: var(--panel-soft);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
            transition: transform 120ms ease, border-color 120ms ease;
            cursor: pointer;
        }

        .link-card:hover {
            transform: translateY(-3px);
            border-color: rgba(116, 191, 82, 0.48);
        }

        .link-icon { font-size: 28px; }
        .link-title { font-size: 16px; font-weight: bold; color: var(--accent); }
        .link-desc { color: var(--muted); font-size: 12px; line-height: 1.5; }

        .link-card-admin {
            border-color: rgba(210, 87, 67, 0.3);
        }

        .link-card-admin:hover {
            border-color: rgba(210, 87, 67, 0.6);
        }

        .link-card-admin .link-title {
            color: var(--danger);
        }

        [v-cloak] { display: none; }
    </style>
</head>
<body>

<div id="app" v-cloak>
    <div class="portal-shell" v-if="user">
        <div class="portal-header">
            <h1 class="portal-title">⚔️ 知春CTF</h1>
            <p class="portal-subtitle">Minecraft Capture The Flag</p>
        </div>

        <div class="user-bar">
            <div class="user-info">
                <span>👤</span>
                <span class="user-name">{{ user.name }}</span>
                <span class="user-id">ID: {{ user.id }}</span>
            </div>
            <button class="logout-btn" @click="logout">🚪 退出登录</button>
        </div>

        <div class="links-grid">
            <a class="link-card" href="/viewer2d">
                <span class="link-icon">🗺️</span>
                <span class="link-title">Viewer 2D</span>
                <span class="link-desc">2D 小地图实时观战</span>
            </a>
            <a class="link-card" href="/viewer3d">
                <span class="link-icon">🎮</span>
                <span class="link-title">Viewer 3D</span>
                <span class="link-desc">3D 实时对局预览与回放</span>
            </a>
            <a class="link-card" href="/statistics">
                <span class="link-icon">📊</span>
                <span class="link-title">数据统计</span>
                <span class="link-desc">游戏对局数据统计看板</span>
            </a>
            <a class="link-card" href="/register">
                <span class="link-icon">📝</span>
                <span class="link-title">团队注册</span>
                <span class="link-desc">创建与管理比赛分组</span>
            </a>
            <a class="link-card link-card-admin" href="/admin">
                <span class="link-icon">🛡️</span>
                <span class="link-title">管理员面板</span>
                <span class="link-desc">系统管理与配置</span>
            </a>
        </div>
    </div>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const user = ref(null);

        onMounted(async () => {
            try {
                const res = await fetch('/login/check');
                if (!res.ok) {
                    localStorage.removeItem('user');
                    window.location.href = '/login';
                    return;
                }
                const data = await res.json();
                localStorage.setItem('user', JSON.stringify(data));
                user.value = data;
            } catch {
                localStorage.removeItem('user');
                window.location.href = '/login';
            }
        });

        const logout = async () => {
            try {
                await fetch('/login/logout', { method: 'POST' });
            } catch {}
            localStorage.removeItem('user');
            window.location.href = '/login';
        };

        return { user, logout };
    }
}).mount('#app');
</script>
</body>
</html>
